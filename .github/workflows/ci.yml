name: ci

on:
  push:
    branches: [main]
  pull_request:

# 全程 UTF-8：源码、文档、命令行参数里都有中文。Windows runner 的默认代码页
# 不是 UTF-8，不加这两行会在打印中文时抛 UnicodeEncodeError（不是代码的错，
# 但会让人误以为代码挂了）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  regress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 环境信息
        run: python -c "import sys, locale; print(sys.version); print('encoding:', sys.stdout.encoding); print('preferred:', locale.getpreferredencoding())"
      # 项目刻意只用标准库，无需安装任何依赖
      - name: 冒烟：mock 流水线
        run: python src/pipeline.py "帮我设计一块 Arduino 最小系统板"
      - name: 产物落盘自检
        run: python -c "import os; need=['bom.csv','bom.json','netlist.json','board.net','board.kicad_sch','pcbagent.kicad_sym','board.kicad_pro']; miss=[f for f in need if not os.path.exists(os.path.join('out',f))]; print('缺失:', miss) if miss else print('8 个产物齐全'); raise SystemExit(1 if miss else 0)"
      - name: 回归集
        run: python scripts/regress.py
